services:
  mongodb:
    image: mongo:latest
    container_name: omr_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - omr_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo-express:
    image: mongo-express:latest
    container_name: omr_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  omr_mongo_data:
    name: omr_mongo_data
